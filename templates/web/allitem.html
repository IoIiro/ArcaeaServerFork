{% extends 'base.html' %}
{% block title %}All items{% endblock %}

{% block content %}
{% if posts %}
<div class="card-list">
    {% for item in posts %}
    <div class="data-card">
        <div><span class="field-label">Id:</span> <span class="field-value"
                style="font-weight:600;">{{item['item_id']}}</span></div>
        <div style="margin-top:.25em;"><span class="field-label">Type:</span> {{item['type']}}</div>
        <div><span class="field-label">Is available:</span> {{item['is_available']}}</div>
    </div>
    {% if not loop.last %}
    <hr style="border:none;border-top:1px solid #e5e7eb;margin:.4rem 0;">{% endif %}
    {% endfor %}
</div>
{% endif %}

{% endblock %}
