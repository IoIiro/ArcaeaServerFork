{% extends 'base.html' %}
{% block title %}Redeem — {{code}}{% endblock %}

{% block content %}
{% if posts %}
<div class="card-list">
    {% for user in posts %}
    <div class="player-card" style="margin-bottom:.5rem;">
        <span class="name">{{user['name']}}</span>
        &nbsp;
        <span class="meta-tag">UID: {{user['user_id']}}</span>
        <span class="meta-tag">User code: {{user['user_code']}}</span>
    </div>
    {% endfor %}
</div>
{% endif %}

<br><a href="{{ url_for('index.all_redeem') }}">← Back to all redeem codes</a>

{% endblock %}
