{% extends 'base.html' %}
{% block title %}Ban the user{% endblock %}

{% block content %}
<form class="form-block" action="/web/banuser" method="post">
    <div class="form-title">Ban the user</div>

    <label for="name">Arcaea Username</label>
    <input name="name" id="name"><br><span style="font-size:.84rem; color:#6b7280;">or</span><br>

    <label for="user_code">Arcaea User Code</label>
    <input name="user_code" id="user_code">

    <div class="form-hint mt-sm">Tip: Reset the user password to unseal the account.</div>

    <input type="submit" value="Execute">
</form>

<form class="form-block" action="/web/banuser/deleteuserscore" method="post">
    <div class="form-title">Delete all of the user's scores</div>

    <label for="name">Arcaea Username</label>
    <input name="name" id="name"><br><span style="font-size:.84rem; color:#6b7280;">or</span><br>

    <label for="user_code">Arcaea User Code</label>
    <input name="user_code" id="user_code">

    <div class="form-hint mt-sm" style="color:#991b1b; border-left:3px solid #ef4444;">Warning! This operation is
        destructive and unrecoverable.</div>

    <input type="submit" value="Execute">
</form>

{% endblock %}
